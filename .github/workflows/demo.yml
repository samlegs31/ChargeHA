name: Deploy demo to GitHub Pages

# Called by CI on main after tests pass, or run manually. The demo is opt-in:
# enable GitHub Pages with GitHub Actions as the publishing source, then set the
# ENABLE_GITHUB_PAGES_DEMO repository variable to "true".
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Single in-flight Pages deployment; don't cancel one already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.ENABLE_GITHUB_PAGES_DEMO == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - run: deno task build:demo
        env:
          VITE_GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/server/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
