name: Fix energy flow battery status truncation

on:
  push:
    branches:
      - design/premium-home-2026

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-home-2026

      - name: Fix battery meta width
        shell: python
        run: |
          from pathlib import Path
          path = Path("packages/client/src/components/EnergyFlowDiagram/EnergyFlowDiagram.module.css")
          text = path.read_text()
          old = ".nodeMeta {\n  max-width: 84px;"
          new = ".nodeMeta {\n  max-width: 100%;"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one nodeMeta width rule, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/client/src/components/EnergyFlowDiagram/EnergyFlowDiagram.module.css
          git commit -m "Fix energy flow battery status truncation"
          git push origin HEAD:design/premium-home-2026
