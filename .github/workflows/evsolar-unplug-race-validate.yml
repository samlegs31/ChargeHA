name: EV Solar unplug race targeted validation

on:
  push:
    branches:
      - fix/tesla-unplugged-command-race
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Install dependencies
        run: deno install --frozen

      - name: Format check changed files
        run: >-
          deno fmt --check
          packages/server/src/services/VehicleManager.ts
          packages/server/src/services/VehicleManager.unplugRace.test.ts

      - name: Lint changed files
        run: >-
          deno lint
          packages/server/src/services/VehicleManager.ts
          packages/server/src/services/VehicleManager.unplugRace.test.ts

      - name: Type check changed files
        run: >-
          deno check
          packages/server/src/services/VehicleManager.ts
          packages/server/src/services/VehicleManager.unplugRace.test.ts

      - name: Run unplug race regression test
        run: >-
          deno test
          --allow-net
          --allow-read
          --allow-write
          --allow-env
          --allow-ffi
          --unstable-ffi
          packages/server/src/services/VehicleManager.unplugRace.test.ts
