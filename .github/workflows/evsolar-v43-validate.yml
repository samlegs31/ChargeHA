name: E.V Solar v4.3 candidate validation

on:
  push:
    branches:
      - agent/evsolar-v43-ci-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evsolar-v43-ci-validation
  cancel-in-progress: true

env:
  BASE_SHA: cdc308ebd7e8bc8386fe5eae81b894f9d8cc5708
  PAYLOAD_BLOB_SHA: 5dc289aceab56a42f66d7f6e61b1b8ec498ee930
  TRANSFORM_BLOB_SHA: 03d7fcdd29a62657b9191408ae248e8075c94943

jobs:
  validate:
    name: Deno 2.9.4 full validation
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate integrity and preserve artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          payload_blob="$(git hash-object .github/candidates/evsolar-v43-payload.tar.gz)"
          transform_blob="$(git hash-object .github/candidates/evsolar-v43-transform.py)"
          printf 'payload git blob:   %s\n' "$payload_blob"
          printf 'transform git blob: %s\n' "$transform_blob"
          test "$payload_blob" = "$PAYLOAD_BLOB_SHA"
          test "$transform_blob" = "$TRANSFORM_BLOB_SHA"
          sha256sum .github/candidates/evsolar-v43-payload.tar.gz
          sha256sum .github/candidates/evsolar-v43-transform.py
          cp .github/candidates/evsolar-v43-payload.tar.gz /tmp/evsolar-v43-payload.tar.gz
          cp .github/candidates/evsolar-v43-transform.py /tmp/evsolar-v43-transform.py
          python3 -m py_compile /tmp/evsolar-v43-transform.py

      - name: Restore exact audited baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --hard "$BASE_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Setup Deno 2.9.4
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Reproducible dependency install
        run: deno ci

      - name: Print Deno version
        run: deno --version

      - id: baseline_deno_check
        name: Baseline full type-check (reference only)
        continue-on-error: true
        run: deno check --frozen

      - id: baseline_invariants
        name: Baseline repository invariants (reference only)
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          deno task check:unused
          deno task check:packument

      - id: baseline_server_tests
        name: Baseline server tests (reference only)
        continue-on-error: true
        run: deno task test:server

      - id: baseline_client_tests
        name: Baseline client tests (reference only)
        continue-on-error: true
        run: deno task test:client

      - name: Capture lint debt baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            packages/client/src/components/pages/Settings/Settings.tsx
            packages/client/src/components/pages/Settings/SolarForecastSettings.tsx
            packages/client/src/components/pages/Stats/StatsVehicleBreakdown.tsx
            packages/plugins/types.ts
            packages/plugins/energy/fronius-local/server/FroniusLocalAdapter.ts
            packages/plugins/energy/fronius-local/server/index.ts
            packages/server/src/bootstrap/bootstrap.ts
            packages/server/src/db/AppDatabase.ts
            packages/server/src/db/Schema.ts
            packages/server/src/services/EnergyAdapterManager.ts
            packages/server/src/services/SolarForecastService.ts
            packages/server/src/services/SolarForecastService.test.ts
            packages/server/src/services/StatsService.test.ts
            packages/server/src/services/StatsService.ts
            packages/server/src/trpc/root.ts
            packages/server/src/trpc/routers/energy.ts
            packages/server/src/trpc/trpc.ts
            packages/shared/configSections.ts
            packages/shared/forecast.ts
            packages/shared/types.ts
          )
          : > /tmp/lint-baseline.tsv
          for rel in "${files[@]}"; do
            if [[ ! -f "$rel" ]]; then
              printf '%s\t0\n' "$rel" >> /tmp/lint-baseline.tsv
              continue
            fi
            set +e
            deno lint "$rel" > /tmp/lint-one.txt 2>&1
            set -e
            count="$(grep -c 'error\[' /tmp/lint-one.txt || true)"
            printf '%s\t%s\n' "$rel" "$count" >> /tmp/lint-baseline.tsv
          done
          cat /tmp/lint-baseline.tsv

      - name: Inspect candidate payload archive
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          gzip -tv /tmp/evsolar-v43-payload.tar.gz > /tmp/evsolar-v43-gzip.log 2>&1
          gzip_status=$?
          tar -tzvf /tmp/evsolar-v43-payload.tar.gz > /tmp/evsolar-v43-tar-list.log 2>&1
          tar_status=$?
          set -e
          {
            echo '### Candidate payload gzip check'
            echo '```text'
            cat /tmp/evsolar-v43-gzip.log
            echo '```'
            echo '### Candidate payload tar listing'
            echo '```text'
            tail -n 200 /tmp/evsolar-v43-tar-list.log
            echo '```'
            printf 'gzip status: %s  |  tar-list status: %s\n' "$gzip_status" "$tar_status"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( gzip_status != 0 || tar_status != 0 )); then
            cat /tmp/evsolar-v43-gzip.log
            cat /tmp/evsolar-v43-tar-list.log
            exit 1
          fi

      - name: Extract candidate payload exactly
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          tar -xzvf /tmp/evsolar-v43-payload.tar.gz --no-same-owner -C . > /tmp/evsolar-v43-extract.log 2>&1
          status=$?
          set -e
          {
            echo '### Candidate payload extraction'
            echo '```text'
            tail -n 200 /tmp/evsolar-v43-extract.log
            echo '```'
            printf 'extract status: %s\n' "$status"
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/evsolar-v43-extract.log
          exit "$status"

      - name: Apply candidate transform exactly
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          python3 /tmp/evsolar-v43-transform.py 2>&1 | tee /tmp/evsolar-v43-transform.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo '### Candidate transform output'
            echo '```text'
            tail -n 100 /tmp/evsolar-v43-transform.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Record candidate reconstruction
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --short
          git diff --name-only "$BASE_SHA" | sort > /tmp/evsolar-v43-files.txt

      - id: diff_check
        name: Candidate patch whitespace check
        continue-on-error: true
        run: git diff --check "$BASE_SHA"

      - id: lock_snapshot
        name: Capture candidate lockfile state
        continue-on-error: true
        run: sha256sum deno.lock > /tmp/deno-lock-after-apply.sha256

      - id: format
        name: Format check (read-only)
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t fmt_files < <(git diff --name-only --diff-filter=AM "$BASE_SHA" | grep -E '\.(ts|tsx|json)$' || true)
          if ((${#fmt_files[@]})); then
            deno fmt --check "${fmt_files[@]}"
          fi

      - id: architecture
        name: Architecture and physics invariants
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'const chargeHistoryService = new ChargeHistoryService(db);' packages/server/src/bootstrap/bootstrap.ts
          grep -q '\.\.\.auxServices,' packages/server/src/bootstrap/bootstrap.ts
          ! grep -q 'getRecentObservedSolarMaxW' packages/server/src/services/SolarForecastService.ts
          ! grep -q 'BASE_SYSTEM_EFFICIENCY' packages/server/src/services/SolarForecastService.ts
          ! grep -qi 'fronius' packages/server/src/services/SolarForecastService.ts
          grep -q 'const currentPoint = closestPoint(combinedDc, now);' packages/server/src/services/SolarForecastService.ts
          grep -q 'computeLivePvCorrection' packages/server/src/services/SolarForecastService.ts
          ! grep -q 'inverterAcPowerW' packages/shared/types.ts
          ! grep -q 'inverterAcPowerW' packages/plugins/energy/fronius-local/server/FroniusLocalAdapter.ts
          grep -q 'probeFroniusSunSpec' packages/plugins/energy/fronius-local/server/index.ts
          ! grep -q 'window\.' packages/client/src/components/pages/Settings/ChargeHqHistoryImport.tsx

      - id: lint_new
        name: New files lint clean
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          deno lint \
            packages/client/src/components/pages/Settings/ChargeHqHistoryImport.tsx \
            packages/plugins/energy/fronius-local/server/FroniusInverterProfiles.test.ts \
            packages/plugins/energy/fronius-local/server/FroniusInverterProfiles.ts \
            packages/plugins/energy/fronius-local/server/FroniusSunSpec.test.ts \
            packages/plugins/energy/fronius-local/server/FroniusSunSpec.ts \
            packages/server/src/db/repositories/ChargeHistoryRepository.test.ts \
            packages/server/src/db/repositories/ChargeHistoryRepository.ts \
            packages/server/src/services/ChargeHistoryService.test.ts \
            packages/server/src/services/ChargeHistoryService.ts \
            packages/server/src/trpc/routers/chargeHistory.ts \
            packages/shared/inverter.test.ts \
            packages/shared/inverter.ts

      - id: lint_existing
        name: Existing files add zero lint debt
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          regressions=0
          while IFS=$'\t' read -r rel before; do
            [[ -f "$rel" ]] || continue
            set +e
            deno lint "$rel" > /tmp/lint-after.txt 2>&1
            set -e
            after="$(grep -c 'error\[' /tmp/lint-after.txt || true)"
            printf '%-72s %s -> %s\n' "$rel" "$before" "$after"
            if (( after > before )); then
              regressions=1
              cat /tmp/lint-after.txt
            fi
          done < /tmp/lint-baseline.tsv
          exit "$regressions"

      - id: deno_check
        name: Blocking Deno type-check
        continue-on-error: true
        run: deno check --frozen

      - name: Shadow tsgo type-check (informational)
        continue-on-error: true
        run: deno check --frozen --unstable-tsgo

      - id: pure_tests
        name: Pure inverter tests (no permissions)
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          deno test --frozen \
            packages/shared/inverter.test.ts \
            packages/plugins/energy/fronius-local/server/FroniusInverterProfiles.test.ts

      - id: sunspec_strict
        name: SunSpec strict network tests with sanitizers
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          deno test --frozen \
            --allow-net=127.0.0.1,localhost \
            --sanitize-ops \
            --sanitize-resources \
            packages/plugins/energy/fronius-local/server/FroniusSunSpec.test.ts

      - id: sunspec_stress
        name: SunSpec race stress (repeats + shuffle)
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          deno test --frozen \
            --allow-net=127.0.0.1,localhost \
            --sanitize-ops \
            --sanitize-resources \
            --repeats=20 \
            --shuffle \
            packages/plugins/energy/fronius-local/server/FroniusSunSpec.test.ts

      - id: targeted_tests
        name: Candidate targeted service tests
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          deno test --frozen --allow-all \
            packages/server/src/services/ChargeHistoryService.test.ts \
            packages/server/src/db/repositories/ChargeHistoryRepository.test.ts \
            packages/server/src/services/StatsService.test.ts \
            packages/server/src/services/SolarForecastService.test.ts \
            packages/plugins/energy/fronius-local/server/FroniusLocalAdapter.test.ts

      - id: invariants
        name: Candidate repository invariants
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          deno task check:unused
          deno task check:packument

      - id: server_tests
        name: Full server tests
        continue-on-error: true
        run: deno task test:server

      - id: client_tests
        name: Client Vitest suite
        continue-on-error: true
        run: deno task test:client

      - id: client_build
        name: Vite production build
        continue-on-error: true
        run: deno task build

      - name: Explain better-sqlite3 dependency path
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          deno why --frozen better-sqlite3
          status=$?
          set -e
          if (( status != 0 )); then
            echo 'better-sqlite3 is not present in the resolved dependency tree.'
          fi
          exit 0

      - id: audit
        name: Dependency audit (high + critical)
        continue-on-error: true
        run: deno audit --frozen --level=high

      - id: lock_guard
        name: Lockfile immutability guard
        if: always()
        continue-on-error: true
        shell: bash
        env:
          LOCK_SNAPSHOT: ${{ steps.lock_snapshot.outcome }}
        run: |
          set -Eeuo pipefail
          if [[ "$LOCK_SNAPSHOT" != success ]]; then
            echo 'Candidate lockfile snapshot failed; immutability cannot be verified.'
            exit 1
          fi
          sha256sum -c /tmp/deno-lock-after-apply.sha256

      - name: Validation summary and final gate
        if: always()
        shell: bash
        env:
          BASELINE_DENO_CHECK: ${{ steps.baseline_deno_check.outcome }}
          BASELINE_INVARIANTS: ${{ steps.baseline_invariants.outcome }}
          BASELINE_SERVER_TESTS: ${{ steps.baseline_server_tests.outcome }}
          BASELINE_CLIENT_TESTS: ${{ steps.baseline_client_tests.outcome }}
          DIFF_CHECK: ${{ steps.diff_check.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          ARCHITECTURE: ${{ steps.architecture.outcome }}
          LINT_NEW: ${{ steps.lint_new.outcome }}
          LINT_EXISTING: ${{ steps.lint_existing.outcome }}
          DENO_CHECK: ${{ steps.deno_check.outcome }}
          PURE_TESTS: ${{ steps.pure_tests.outcome }}
          SUNSPEC_STRICT: ${{ steps.sunspec_strict.outcome }}
          SUNSPEC_STRESS: ${{ steps.sunspec_stress.outcome }}
          TARGETED_TESTS: ${{ steps.targeted_tests.outcome }}
          INVARIANTS: ${{ steps.invariants.outcome }}
          SERVER_TESTS: ${{ steps.server_tests.outcome }}
          CLIENT_TESTS: ${{ steps.client_tests.outcome }}
          CLIENT_BUILD: ${{ steps.client_build.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          LOCK_GUARD: ${{ steps.lock_guard.outcome }}
        run: |
          set -Eeuo pipefail
          failures=0
          reference() {
            local name="$1"
            local outcome="$2"
            printf 'baseline %-15s %s (reference only)\n' "$name" "$outcome"
          }
          check() {
            local name="$1"
            local outcome="$2"
            printf '%-24s %s\n' "$name" "$outcome"
            if [[ "$outcome" != success ]]; then failures=$((failures + 1)); fi
          }
          echo '--- Baseline reference ---'
          reference deno-check "$BASELINE_DENO_CHECK"
          reference invariants "$BASELINE_INVARIANTS"
          reference server-tests "$BASELINE_SERVER_TESTS"
          reference client-tests "$BASELINE_CLIENT_TESTS"
          echo '--- Candidate validation ---'
          check diff-check "$DIFF_CHECK"
          check format "$FORMAT"
          check architecture "$ARCHITECTURE"
          check lint-new "$LINT_NEW"
          check lint-existing "$LINT_EXISTING"
          check deno-check "$DENO_CHECK"
          check pure-tests "$PURE_TESTS"
          check sunspec-strict "$SUNSPEC_STRICT"
          check sunspec-stress "$SUNSPEC_STRESS"
          check targeted-tests "$TARGETED_TESTS"
          check invariants "$INVARIANTS"
          check server-tests "$SERVER_TESTS"
          check client-tests "$CLIENT_TESTS"
          check client-build "$CLIENT_BUILD"
          check audit "$AUDIT"
          check lock-guard "$LOCK_GUARD"
          echo "Candidate validation failures: $failures"
          if (( failures > 0 )); then
            exit 1
          fi
          echo 'Candidate validation gate: success'

      - name: Produce validated patch and manifest
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --binary "$BASE_SHA" > /tmp/evsolar-v43-validated.patch
          git diff --stat "$BASE_SHA"
          while IFS= read -r rel; do
            test -f "$rel" && sha256sum "$rel"
          done < /tmp/evsolar-v43-files.txt > /tmp/evsolar-v43-sha256.txt

      - name: Upload validated candidate artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: evsolar-v43-validated-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/evsolar-v43-validated.patch
            /tmp/evsolar-v43-files.txt
            /tmp/evsolar-v43-sha256.txt