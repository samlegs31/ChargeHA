name: Fronius Cloud fix validation

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/plugins/energy/fronius-cloud/**"
      - ".github/workflows/fronius-cloud-fix-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Install dependencies
        run: deno install --frozen

      - name: Format check
        run: |
          deno fmt --check \
            packages/plugins/energy/fronius-cloud/server/router.ts \
            packages/plugins/energy/fronius-cloud/server/resolveTestPassword.ts \
            packages/plugins/energy/fronius-cloud/server/resolveTestPassword.test.ts

      - name: Lint changed Fronius files
        run: |
          deno lint \
            packages/plugins/energy/fronius-cloud/server/router.ts \
            packages/plugins/energy/fronius-cloud/server/resolveTestPassword.ts \
            packages/plugins/energy/fronius-cloud/server/resolveTestPassword.test.ts

      - name: Type check Fronius Cloud server
        run: |
          deno check \
            packages/plugins/energy/fronius-cloud/server/router.ts \
            packages/plugins/energy/fronius-cloud/server/resolveTestPassword.ts \
            packages/plugins/energy/fronius-cloud/server/resolveTestPassword.test.ts

      - name: Run Fronius Cloud tests
        run: |
          deno test --allow-net --allow-read --allow-write --allow-env --allow-ffi --unstable-ffi \
            packages/plugins/energy/fronius-cloud/server/resolveTestPassword.test.ts \
            packages/plugins/energy/fronius-cloud/server/FroniusCloudAdapter.test.ts \
            packages/plugins/energy/fronius-cloud/server/FroniusCloudEndpoint.test.ts
