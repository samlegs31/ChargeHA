name: Fronius Guest Check

on:
  push:
    branches:
      - feature/fronius-solarweb-guest
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fronius-guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Install dependencies
        run: deno install --frozen

      - name: Format Fronius guest plugin
        run: deno fmt packages/plugins/energy/fronius-cloud

      - name: Commit formatter changes
        run: |
          if git diff --quiet -- packages/plugins/energy/fronius-cloud; then
            echo "No formatter changes required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/plugins/energy/fronius-cloud
            git commit -m "style: format Fronius guest plugin"
            git push
          fi

      - name: Check Fronius guest formatting
        run: deno fmt --check packages/plugins/energy/fronius-cloud

      - name: Lint Fronius guest plugin
        run: deno lint packages/plugins/energy/fronius-cloud

      - name: Type-check Fronius guest plugin
        run: |
          deno check \
            packages/plugins/energy/fronius-cloud/server/FroniusCloudAdapter.ts \
            packages/plugins/energy/fronius-cloud/server/router.ts \
            packages/plugins/energy/fronius-cloud/client/FroniusCloudForm.tsx \
            packages/plugins/energy/fronius-cloud/client/FroniusCloudConfig.tsx \
            packages/plugins/energy/fronius-cloud/client/FroniusCloudSetupStep.tsx

      - name: Run Fronius guest server tests
        run: |
          deno test \
            --allow-net \
            --allow-read \
            --allow-write \
            --allow-env \
            --allow-ffi \
            --unstable-ffi \
            packages/plugins/energy/fronius-cloud/server/FroniusCloudAdapter.test.ts \
            packages/plugins/energy/fronius-cloud/server/FroniusCloudEndpoint.test.ts
