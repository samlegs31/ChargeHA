name: Exact E.V. Solar logo production release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/exact-logo-release-once.yml
      - packages/client/index.html
      - packages/client/public/manifest.json
      - packages/client/public/ev-solar-favicon-exact.png

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
      pull-requests: write

  release:
    needs: build
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write
