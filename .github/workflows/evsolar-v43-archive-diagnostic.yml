name: E.V Solar v4.3 archive diagnostic

on:
  push:
    branches:
      - agent/evsolar-v43-ci-validation
  workflow_dispatch:

permissions:
  contents: read

env:
  PAYLOAD_BLOB_SHA: 2d81420475553a9217238405631e8374108138ca

jobs:
  archive:
    name: Candidate archive recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Verify exact payload blob
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object .github/candidates/evsolar-v43-payload.tar.gz)" = "$PAYLOAD_BLOB_SHA"
          cp .github/candidates/evsolar-v43-payload.tar.gz /tmp/evsolar-v43-payload.tar.gz
          stat -c 'bytes=%s' /tmp/evsolar-v43-payload.tar.gz
          sha256sum /tmp/evsolar-v43-payload.tar.gz

      - id: gzip_gnu
        name: Confirm known gzip truncation
        continue-on-error: true
        run: gzip -tv /tmp/evsolar-v43-payload.tar.gz

      - name: Verify every candidate member is fully readable
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import tarfile

          path = '/tmp/evsolar-v43-payload.tar.gz'
          with tarfile.open(path, 'r:gz') as archive:
              members = archive.getmembers()
              print(f'members={len(members)}')
              if len(members) != 5:
                  raise SystemExit(f'unexpected member count: {len(members)}')
              for member in members:
                  print(f'name={member.name!r} type={member.type!r} size={member.size}')
                  if not member.isfile():
                      raise SystemExit(f'non-regular member rejected: {member.name!r}')
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise SystemExit(f'cannot open member: {member.name!r}')
                  data = stream.read()
                  if len(data) != member.size:
                      raise SystemExit(
                          f'truncated member {member.name!r}: got {len(data)}, expected {member.size}'
                      )
                  digest = hashlib.sha256(data).hexdigest()
                  print(f'sha256={digest}  {member.name}')
          PY
