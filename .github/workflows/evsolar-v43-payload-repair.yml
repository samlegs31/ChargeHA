name: E.V Solar v4.3 payload repair

on:
  push:
    branches:
      - agent/evsolar-v43-ci-validation
  workflow_dispatch:

permissions:
  contents: write

env:
  OLD_PAYLOAD_BLOB_SHA: 2d81420475553a9217238405631e8374108138ca
  SQL_SHA256: d456d6e087c61616f5c1a8dc4f551d240c547a2e3c98eaf53993b09ea7a02823
  SNAPSHOT_SHA256: e3cf8943c1c2ba8fb35418a6693e3d2c4d6a201d344752a49b189f541bb45535

jobs:
  repair:
    name: Repair payload container only
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repack exact candidate bytes deterministically
        shell: bash
        run: |
          set -Eeuo pipefail
          current_blob="$(git hash-object .github/candidates/evsolar-v43-payload.tar.gz)"
          if [[ "$current_blob" != "$OLD_PAYLOAD_BLOB_SHA" ]]; then
            echo "Payload is already different from the known truncated blob: $current_blob"
            exit 0
          fi

          python3 - <<'PY'
          import gzip
          import hashlib
          import io
          import pathlib
          import tarfile

          source_path = pathlib.Path('.github/candidates/evsolar-v43-payload.tar.gz')
          output_path = pathlib.Path('/tmp/evsolar-v43-payload.repaired.tar.gz')
          expected_names = [
              '.',
              './drizzle',
              './drizzle/0008_chargehq_history.sql',
              './drizzle/meta',
              './drizzle/meta/0008_snapshot.json',
          ]
          expected_files = {
              './drizzle/0008_chargehq_history.sql': (
                  655,
                  'd456d6e087c61616f5c1a8dc4f551d240c547a2e3c98eaf53993b09ea7a02823',
              ),
              './drizzle/meta/0008_snapshot.json': (
                  28136,
                  'e3cf8943c1c2ba8fb35418a6693e3d2c4d6a201d344752a49b189f541bb45535',
              ),
          }

          with tarfile.open(source_path, 'r:gz') as source:
              members = source.getmembers()
              names = [member.name for member in members]
              if names != expected_names:
                  raise SystemExit(f'unexpected archive members: {names!r}')

              file_bytes: dict[str, bytes] = {}
              for member in members:
                  pure = pathlib.PurePosixPath(member.name)
                  if pure.is_absolute() or '..' in pure.parts:
                      raise SystemExit(f'unsafe path: {member.name!r}')
                  if member.isdir():
                      continue
                  if not member.isfile():
                      raise SystemExit(f'unsupported member type: {member.name!r}')
                  stream = source.extractfile(member)
                  if stream is None:
                      raise SystemExit(f'cannot read: {member.name!r}')
                  data = stream.read()
                  expected_size, expected_sha = expected_files[member.name]
                  digest = hashlib.sha256(data).hexdigest()
                  if len(data) != expected_size or digest != expected_sha:
                      raise SystemExit(
                          f'candidate bytes changed for {member.name!r}: '
                          f'size={len(data)} sha256={digest}'
                      )
                  file_bytes[member.name] = data

              tar_buffer = io.BytesIO()
              with tarfile.open(fileobj=tar_buffer, mode='w') as repaired_tar:
                  for member in members:
                      if member.isfile():
                          repaired_tar.addfile(member, io.BytesIO(file_bytes[member.name]))
                      else:
                          repaired_tar.addfile(member)

          with output_path.open('wb') as raw:
              with gzip.GzipFile(filename='', mode='wb', fileobj=raw, mtime=0) as compressed:
                  compressed.write(tar_buffer.getvalue())
          PY

          gzip -tv /tmp/evsolar-v43-payload.repaired.tar.gz
          tar -tzf /tmp/evsolar-v43-payload.repaired.tar.gz >/dev/null

          python3 - <<'PY'
          import hashlib
          import tarfile

          expected = {
              './drizzle/0008_chargehq_history.sql': 'd456d6e087c61616f5c1a8dc4f551d240c547a2e3c98eaf53993b09ea7a02823',
              './drizzle/meta/0008_snapshot.json': 'e3cf8943c1c2ba8fb35418a6693e3d2c4d6a201d344752a49b189f541bb45535',
          }
          with tarfile.open('/tmp/evsolar-v43-payload.repaired.tar.gz', 'r:gz') as archive:
              actual = {}
              for member in archive.getmembers():
                  if not member.isfile():
                      continue
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise SystemExit(f'cannot verify {member.name!r}')
                  actual[member.name] = hashlib.sha256(stream.read()).hexdigest()
          if actual != expected:
              raise SystemExit(f'repaired payload mismatch: {actual!r}')
          print('Repaired archive preserves both candidate file hashes.')
          PY

          mv /tmp/evsolar-v43-payload.repaired.tar.gz .github/candidates/evsolar-v43-payload.tar.gz
          new_blob="$(git hash-object .github/candidates/evsolar-v43-payload.tar.gz)"
          echo "new payload git blob: $new_blob"

          NEW_PAYLOAD_BLOB_SHA="$new_blob" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.github/workflows/evsolar-v43-validate.yml')
          text = path.read_text()
          old = 'PAYLOAD_BLOB_SHA: 2d81420475553a9217238405631e8374108138ca'
          new = f"PAYLOAD_BLOB_SHA: {os.environ['NEW_PAYLOAD_BLOB_SHA']}"
          if text.count(old) != 1:
              raise SystemExit(f'expected one payload SHA anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected=$'.github/candidates/evsolar-v43-payload.tar.gz\n.github/workflows/evsolar-v43-validate.yml'
          [[ "$changed" == "$expected" ]]

      - name: Commit packaging repair to validation branch
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- .github/candidates/evsolar-v43-payload.tar.gz; then
            echo 'No payload packaging repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/candidates/evsolar-v43-payload.tar.gz
          git commit -m 'ci: repair E.V Solar candidate payload container'
          git push origin HEAD:agent/evsolar-v43-ci-validation
