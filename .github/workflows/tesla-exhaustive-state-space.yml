name: EV Solar exhaustive state-space tests

on:
  push:
    branches:
      - test/tesla-exhaustive-state-space
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Install dependencies
        run: deno install --frozen

      - name: Format exhaustive harnesses in runner
        run: |
          deno fmt \
            packages/plugins/vehicles/tesla/server/TeslaApiStrategy.exhaustive.test.ts \
            packages/shared/engine/ControllerEngine.exhaustive.test.ts \
            packages/shared/engine/ControllerEngine.sequence-exhaustive.test.ts \
            packages/shared/engine/ControllerEngine.virtual-day-fuzz.test.ts

      - name: Type-check exhaustive harnesses
        run: |
          deno check \
            packages/plugins/vehicles/tesla/server/TeslaApiStrategy.exhaustive.test.ts \
            packages/shared/engine/ControllerEngine.exhaustive.test.ts \
            packages/shared/engine/ControllerEngine.sequence-exhaustive.test.ts \
            packages/shared/engine/ControllerEngine.virtual-day-fuzz.test.ts

      - name: Run exhaustive Tesla strategy matrix
        run: deno test -A packages/plugins/vehicles/tesla/server/TeslaApiStrategy.exhaustive.test.ts

      - name: Run 1M stateful charging event sequences
        shell: bash
        run: |
          set +e
          deno test -A packages/shared/engine/ControllerEngine.sequence-exhaustive.test.ts 2>&1 | tee sequence-test.log
          status=${PIPESTATUS[0]}
          echo "$status" > sequence-test.exit-code
          exit "$status"

      - name: Preserve sequence diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateful-sequence-diagnostics
          path: |
            sequence-test.log
            sequence-test.exit-code
          if-no-files-found: error
          retention-days: 7

      - name: Run multi-day virtual-world fuzz
        if: always()
        shell: bash
        run: |
          set +e
          deno test -A packages/shared/engine/ControllerEngine.virtual-day-fuzz.test.ts 2>&1 | tee virtual-day-test.log
          status=${PIPESTATUS[0]}
          echo "$status" > virtual-day-test.exit-code
          exit "$status"

      - name: Preserve virtual-world diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-world-fuzz-diagnostics
          path: |
            virtual-day-test.log
            virtual-day-test.exit-code
          if-no-files-found: error
          retention-days: 7

      - name: Run exhaustive controller safety matrix
        if: always()
        run: deno test -A packages/shared/engine/ControllerEngine.exhaustive.test.ts

      - name: Run all Tesla regression tests
        if: always()
        run: deno test -A packages/plugins/vehicles/tesla/server/*.test.ts packages/server/src/services/VehicleManager.unplugRace.test.ts

      - name: Run complete server test suite
        if: always()
        run: deno task test:server

      - name: Run complete client test suite
        if: always()
        run: deno task test:client
