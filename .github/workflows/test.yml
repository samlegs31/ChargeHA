name: test

on:
  workflow_call:

jobs:
  test:
    name: deno task check:all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-2.9.6-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json', 'packages/*/deno.json') }}
          restore-keys: |
            deno-2.9.6-${{ runner.os }}-

      - name: Print Deno version
        run: deno --version

      # Temporary until the regenerated lockfile is committed and the remaining
      # high-severity advisories are resolved.
      - name: Resolve dependency migration
        run: deno install

      - name: Dependency security audit
        continue-on-error: true
        run: deno audit --level=high

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check

      - name: Check unused files
        run: deno task check:unused

      - name: Check packument bloat
        run: deno task check:packument

      - name: Deployment recovery tests
        run: deno task check:deployment

      - name: Server tests
        shell: bash
        run: |
          set -o pipefail
          deno task test:server 2>&1 | tee server-tests.log

      - name: Client tests
        shell: bash
        run: |
          set -o pipefail
          deno task test:client 2>&1 | tee client-tests.log

      # Temporary diagnostic: regenerate the production-only lockfile from the
      # exact runtime manifests instead of hand-editing a generated lockfile.
      - name: Generate runtime lock diagnostic
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d)"
          mkdir -p "$runtime_dir/packages"
          cp -a packages/shared "$runtime_dir/packages/shared"
          cp -a packages/server "$runtime_dir/packages/server"
          cp -a packages/plugins "$runtime_dir/packages/plugins"
          cp docker/deno.runtime.json "$runtime_dir/deno.json"
          cp docker/deno.runtime.lock "$runtime_dir/deno.lock"
          cp docker/plugins.runtime.deno.json "$runtime_dir/packages/plugins/deno.json"
          cp docker/deno.runtime.lock docker-deno-runtime-before.lock
          (
            cd "$runtime_dir"
            deno install --frozen=false
          )
          cp "$runtime_dir/deno.lock" docker-deno-runtime-generated.lock

      - name: Capture migration worktree
        if: always()
        run: |
          git diff --binary > migration.patch
          git diff --stat > migration-stat.txt
          git status --short > migration-status.txt

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-migration-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            deno.lock
            server-tests.log
            client-tests.log
            docker-deno-runtime-before.lock
            docker-deno-runtime-generated.lock
            migration.patch
            migration-stat.txt
            migration-status.txt
