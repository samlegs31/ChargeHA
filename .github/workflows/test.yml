name: test

on:
  workflow_call:

jobs:
  test:
    name: deno task check:all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-2.9.6-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json', 'packages/*/deno.json') }}
          restore-keys: |
            deno-2.9.6-${{ runner.os }}-

      - name: Print Deno version
        run: deno --version

      - name: Install dependencies (clean frozen lockfile)
        run: deno ci

      - name: Preview compatible security fixes
        run: |
          deno audit --fix --level=high || true
          git diff -- deno.json packages/*/deno.json deno.lock
          deno audit --level=high

      # Keep these checks in the exact same order as `deno task check:all`, but
      # expose each command as its own step so CI failures identify the blocker.
      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check

      - name: Check unused files
        run: deno task check:unused

      - name: Check packument bloat
        run: deno task check:packument

      - name: Deployment recovery tests
        run: deno task check:deployment

      - name: Server tests
        run: deno task test:server

      - name: Client tests
        run: deno task test:client
