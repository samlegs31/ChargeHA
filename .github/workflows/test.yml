name: test

on:
  workflow_call:

jobs:
  test:
    name: deno task check:all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-2.9.6-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json', 'packages/*/deno.json') }}
          restore-keys: |
            deno-2.9.6-${{ runner.os }}-

      - name: Print Deno version
        run: deno --version

      # One-time repair for the dependency migration. The connector cannot
      # safely transfer the generated 120+ KiB lockfile byte-for-byte, so Deno
      # regenerates it on the actual PR branch and commits it only if changed.
      - name: Regenerate migrated lockfile once
        if: github.event_name == 'pull_request' && github.head_ref == 'perf-security-2026'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          rm -f deno.lock
          deno install
          if git diff --quiet -- deno.lock; then
            echo "deno.lock is already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add deno.lock
            git commit -m "build: regenerate Deno lockfile with 2.9.6"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi

      - name: Install locked dependencies
        run: deno ci

      - name: Dependency security audit
        run: deno audit --level=high

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check

      - name: Check unused files
        run: deno task check:unused

      - name: Check packument bloat
        run: deno task check:packument

      - name: Deployment recovery tests
        run: deno task check:deployment

      - name: Server tests
        run: deno task test:server

      - name: Client tests
        run: deno task test:client
