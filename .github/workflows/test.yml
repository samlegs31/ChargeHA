name: test

on:
  workflow_call:

jobs:
  test:
    name: deno task check:all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-2.9.6-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json', 'packages/*/deno.json') }}
          restore-keys: |
            deno-2.9.6-${{ runner.os }}-

      - name: Print Deno version
        run: deno --version

      - name: Install locked dependencies
        run: deno ci

      - name: Dependency security audit
        run: deno audit --level=high

      - name: Runtime dependency security audit
        run: deno audit --lock docker/deno.runtime.lock --level=high

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check

      - name: Check unused files
        run: deno task check:unused

      - name: Check packument bloat
        run: deno task check:packument

      - name: Deployment recovery tests
        run: deno task check:deployment

      - name: Server tests
        run: deno task test:server

      - name: Client tests
        id: client_tests
        run: |
          set -o pipefail
          deno task test:client 2>&1 | tee client-tests.log

      - name: Upload client test failure log
        if: always() && steps.client_tests.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: strict-client-test-failure
          path: client-tests.log
          if-no-files-found: error
