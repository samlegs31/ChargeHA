name: test

on:
  workflow_call:

jobs:
  test:
    name: deno task check:all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-2.9.6-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json', 'packages/*/deno.json') }}
          restore-keys: |
            deno-2.9.6-${{ runner.os }}-

      - name: Print Deno version
        run: deno --version

      # Temporary migration validation: resolve the updated package ranges and
      # exercise the full suite before the resulting lockfile is committed.
      - name: Resolve dependency migration
        run: deno install

      - name: Dependency security audit
        continue-on-error: true
        run: deno audit --level=high

      - name: Show lockfile migration
        run: git diff -- deno.lock

      # Keep these checks in the exact same order as `deno task check:all`, but
      # expose each command as its own step so CI failures identify the blocker.
      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check

      - name: Check unused files
        run: deno task check:unused

      - name: Check packument bloat
        run: deno task check:packument

      - name: Deployment recovery tests
        run: deno task check:deployment

      - name: Server tests
        run: deno task test:server

      - name: Client tests
        run: deno task test:client
