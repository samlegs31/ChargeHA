name: test

on:
  workflow_call:

jobs:
  test:
    name: deno task check:all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-2.9.6-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json', 'packages/*/deno.json') }}
          restore-keys: |
            deno-2.9.6-${{ runner.os }}-

      - name: Print Deno version
        run: deno --version

      # Temporary migration validation: resolve the updated package ranges and
      # exercise the full suite before the resulting lockfile is committed.
      - name: Resolve dependency migration
        run: deno install

      - name: Dependency security audit
        continue-on-error: true
        run: deno audit --level=high

      # Format only files changed by this PR in the ephemeral runner. This lets
      # lint/type/tests continue while preserving a patch we can commit cleanly.
      - name: Format migration files
        run: |
          deno fmt \
            .github/workflows/test.yml \
            packages/client/deno.json \
            packages/client/src/components/pages/Dashboard/Dashboard.tsx \
            packages/client/src/components/pages/Dashboard/VehicleList.tsx \
            packages/client/src/components/pages/Dashboard/energyHelpers.ts \
            packages/client/vite.config.ts \
            packages/plugins/deno.json \
            packages/server/src/bootstrap/bootstrap.ts \
            packages/server/src/lib/AsyncQueue.test.ts \
            packages/server/src/lib/AsyncQueue.ts

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check

      - name: Check unused files
        run: deno task check:unused

      - name: Check packument bloat
        run: deno task check:packument

      - name: Deployment recovery tests
        run: deno task check:deployment

      - name: Server tests
        run: deno task test:server

      - name: Client tests
        run: deno task test:client

      - name: Capture migration worktree
        if: always()
        run: |
          git diff --binary > migration.patch
          git diff --stat > migration-stat.txt
          git status --short > migration-status.txt

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-migration-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            deno.lock
            migration.patch
            migration-stat.txt
            migration-status.txt
