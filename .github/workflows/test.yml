name: test

on:
  workflow_call:

jobs:
  test:
    name: deno task check:all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-2.9.6-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json', 'packages/*/deno.json') }}
          restore-keys: |
            deno-2.9.6-${{ runner.os }}-

      - name: Print Deno version
        run: deno --version

      # Temporary migration validation: resolve updated ranges and exercise the
      # complete suite before committing the generated lockfile.
      - name: Resolve dependency migration
        run: deno install

      - name: Dependency security audit
        continue-on-error: true
        run: deno audit --level=high

      - name: Format migration files
        run: |
          deno fmt \
            .github/workflows/test.yml \
            packages/client/deno.json \
            packages/client/src/components/pages/Dashboard/Dashboard.tsx \
            packages/client/src/components/pages/Dashboard/VehicleList.tsx \
            packages/client/src/components/pages/Dashboard/energyHelpers.ts \
            packages/client/vite.config.ts \
            packages/plugins/deno.json \
            packages/server/src/bootstrap/bootstrap.ts \
            packages/server/src/lib/AsyncQueue.test.ts \
            packages/server/src/lib/AsyncQueue.ts

      # Apply the two structural lint fixes in the disposable runner so we can
      # validate them before committing the resulting source files.
      - name: Validate structural lint fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          vehicle_path = Path("packages/client/src/components/pages/Dashboard/VehicleList.tsx")
          vehicle = vehicle_path.read_text()
          vehicle = vehicle.replace("  useHomeConfig,\n", "")
          vehicle = vehicle.replace(
              'import { useVehicleSolarGrid } from "./energyHelpers.ts";',
              'import {\n  useConfiguredHomeLocation,\n  useVehicleSolarGrid,\n} from "./energyHelpers.ts";',
          )
          vehicle = vehicle.replace('  const { data: homeConfig } = useHomeConfig();\n', '')
          vehicle, count = re.subn(
              r'  const homeLat = homeConfig\?\.homeLatitude;\n'
              r'  const homeLng = homeConfig\?\.homeLongitude;\n'
              r'  const home = useMemo\([\s\S]*?\n  \);\n'
              r'(?=  const timezone =)',
              '  const home = useConfiguredHomeLocation();\n',
              vehicle,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"VehicleList home-location replacement count={count}")
          vehicle_path.write_text(vehicle)

          bootstrap_path = Path("packages/server/src/bootstrap/bootstrap.ts")
          bootstrap = bootstrap_path.read_text()
          start = bootstrap.index('  const staticRoot = "./packages/server/dist";')
          end = bootstrap.index('\n\n  return app;', start)
          bootstrap = bootstrap[:start] + '  registerStaticAssets(app);' + bootstrap[end:]
          marker = '\nfunction setupTrpcEndpoint('
          helper = r'''

          function registerStaticAssets(app: Hono) {
            const staticRoot = "./packages/server/dist";
            app.use(
              "/*",
              serveStatic({
                root: staticRoot,
                precompressed: true,
                onFound: (_path, c) => {
                  const cacheControl = c.req.path.startsWith("/assets/")
                    ? "public, max-age=31536000, immutable"
                    : "no-cache";
                  c.header("Cache-Control", cacheControl);
                },
              }),
            );
            app.use(
              "/*",
              serveStatic({
                root: staticRoot,
                path: "index.html",
                precompressed: true,
                onFound: (_path, c) => c.header("Cache-Control", "no-cache"),
              }),
            );
          }
          '''
          if marker not in bootstrap:
              raise SystemExit("bootstrap insertion marker not found")
          bootstrap = bootstrap.replace(marker, helper + marker, 1)
          bootstrap_path.write_text(bootstrap)
          PY
          deno fmt \
            packages/client/src/components/pages/Dashboard/VehicleList.tsx \
            packages/server/src/bootstrap/bootstrap.ts

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check

      - name: Check unused files
        run: deno task check:unused

      - name: Check packument bloat
        run: deno task check:packument

      - name: Deployment recovery tests
        run: deno task check:deployment

      - name: Server tests
        run: deno task test:server

      - name: Client tests
        run: deno task test:client

      - name: Capture migration worktree
        if: always()
        run: |
          git diff --binary > migration.patch
          git diff --stat > migration-stat.txt
          git status --short > migration-status.txt

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-migration-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            deno.lock
            migration.patch
            migration-stat.txt
            migration-status.txt
            packages/client/src/components/pages/Dashboard/VehicleList.tsx
            packages/server/src/bootstrap/bootstrap.ts
