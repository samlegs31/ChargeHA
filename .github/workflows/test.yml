name: test

on:
  workflow_call:

jobs:
  test:
    name: deno task check:all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-2.9.4-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json', 'packages/*/deno.json') }}
          restore-keys: |
            deno-2.9.4-${{ runner.os }}-

      - name: Print Deno version
        run: deno --version

      - name: Install dependencies (frozen lockfile)
        run: deno install --frozen

      # Keep these checks in the exact same order as `deno task check:all`, but
      # expose each command as its own step so CI failures identify the blocker.
      - name: Format
        run: deno fmt

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        shell: bash
        run: |
          set +e
          deno check > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          if [ "$status" -ne 0 ]; then
            tail -n 120 typecheck.log > typecheck-tail.log
            message=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g' typecheck-tail.log)
            echo "::error title=Deno type-check::$message"
          fi
          exit "$status"

      - name: Check unused files
        run: deno task check:unused

      - name: Check packument bloat
        run: deno task check:packument

      - name: Server tests
        run: deno task test:server

      - name: Client tests
        run: deno task test:client
