name: Temporary Tesla location privacy v2

on:
  push:
    branches:
      - fix/tesla-location-only-when-plugged
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Install dependencies
        run: deno install --frozen

      - name: Apply Tesla location privacy patch
        run: python3 scripts/temp_apply_tesla_location_privacy_v2.py

      - name: Align plug-in polling regression setup
        run: python3 scripts/temp_adjust_tesla_location_test_v2.py

      - name: Format changed files
        run: |
          deno fmt \
            packages/plugins/vehicles/tesla/server/TeslaAdapter.ts \
            packages/plugins/vehicles/tesla/server/TeslaVehicleMiddleware.ts \
            packages/plugins/vehicles/tesla/server/test-helpers/MockTeslaAdapter.ts \
            packages/plugins/vehicles/tesla/server/TeslaAdapter.test.ts \
            packages/plugins/vehicles/tesla/server/TeslaVehicleMiddleware.test.ts

      - name: Lint changed files
        run: |
          deno lint \
            packages/plugins/vehicles/tesla/server/TeslaAdapter.ts \
            packages/plugins/vehicles/tesla/server/TeslaVehicleMiddleware.ts \
            packages/plugins/vehicles/tesla/server/test-helpers/MockTeslaAdapter.ts \
            packages/plugins/vehicles/tesla/server/TeslaAdapter.test.ts \
            packages/plugins/vehicles/tesla/server/TeslaVehicleMiddleware.test.ts

      - name: Type check
        run: |
          deno check \
            packages/plugins/vehicles/tesla/server/TeslaAdapter.ts \
            packages/plugins/vehicles/tesla/server/TeslaVehicleMiddleware.ts \
            packages/plugins/vehicles/tesla/server/TeslaAdapter.test.ts \
            packages/plugins/vehicles/tesla/server/TeslaVehicleMiddleware.test.ts

      - name: Run Tesla regression tests
        run: |
          deno test -A \
            packages/plugins/vehicles/tesla/server/TeslaAdapter.test.ts \
            packages/plugins/vehicles/tesla/server/TeslaVehicleMiddleware.test.ts \
            packages/server/src/services/VehicleManager.unplugRace.test.ts

      - name: Commit validated patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/plugins/vehicles/tesla/server/TeslaAdapter.ts \
            packages/plugins/vehicles/tesla/server/TeslaVehicleMiddleware.ts \
            packages/plugins/vehicles/tesla/server/test-helpers/MockTeslaAdapter.ts \
            packages/plugins/vehicles/tesla/server/TeslaAdapter.test.ts \
            packages/plugins/vehicles/tesla/server/TeslaVehicleMiddleware.test.ts
          git commit -m "fix(tesla): avoid location polling while driving"
          git push
