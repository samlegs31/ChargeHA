name: Format premium Home branch

on:
  push:
    branches: [design/premium-home-2026]

permissions:
  contents: write

jobs:
  format:
    if: ${{ ! startsWith(github.event.head_commit.message, 'chore: format premium Home') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-home-2026
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno fmt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/client/src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: format premium Home"
          git push origin HEAD:design/premium-home-2026
