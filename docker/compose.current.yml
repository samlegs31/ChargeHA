# Recovery template only. Loading the image does not start this service.
# Use the original deployment's host bindings and data/key locations.
services:
  evsolar:
    image: evsolar:maintenance-20261007
    pull_policy: never
    container_name: chargeha
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      ENCRYPTION_KEY_FILE: /run/secrets/evsolar_encryption_key
    volumes:
      - chargeha-data:/app/data
      - ${EVSOLAR_KEY_FILE:?Set the existing recovery key path}:/run/secrets/evsolar_encryption_key:ro
    ports:
      - "${EVSOLAR_BIND:?Set the original host binding}:8000"
volumes:
  chargeha-data:
    name: ${EVSOLAR_DATA_VOLUME:-chargeha-data}
    external: true
